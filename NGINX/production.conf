server {
    listen 80;
    server_name buzzlyn.com www.buzzlyn.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name buzzlyn.com www.buzzlyn.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/buzzlyn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buzzlyn.com/privkey.pem;
    
    # Enhanced security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    
    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Frontend
    location / {
        proxy_pass http://pricetrack-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
       
    }
    
    # Main API
    location /api/ {
        proxy_pass http://pricetrack-main:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth Callback (must come before the more general /auth/ location)
    location = /auth/callback {
        proxy_pass http://pricetrack-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Auth Service
    location /auth/ {
        proxy_pass http://pricetrack-security:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth2 Authorization Endpoints
    location /oauth2/ {
        proxy_pass http://pricetrack-security:8081/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login endpoint (not just /login/ with trailing slash)
    location = /login {
        proxy_pass http://pricetrack-security:8081/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Python Scraper API (if needed publicly)
    location /scraper/ {
        proxy_pass http://pricetrack-scraper:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    # URL Redirection Service
    location /redirect {
        # Extract the URL from the query parameter
        if ($args ~* url=(.+)) {
            set $redirect_url $1;
            # Perform the redirect
            return 302 $redirect_url;
        }
        
        # If no URL parameter is provided, redirect to homepage
        return 302 /;
    }
    
}
