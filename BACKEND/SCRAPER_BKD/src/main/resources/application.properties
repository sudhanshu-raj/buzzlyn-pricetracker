spring.application.name=SCRAPER_BKD
server.port=8082

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/Scraper?createDatabaseIfNotExist=true

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#log properties
logging.file.name=logs/app.log

# Log level (adjust as needed: TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
logging.level.org.springframework=INFO

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

mailjet.api.key=${MAILJEY_API_KEY}
mailjet.api.secret=${MAILJEY_API_SECRET}
mailjet.sender.email=${MAILJEY_SENDER_EMAIL}

twilio.account_sid=${TWILIO_ACCOUNT_SID}
twilio.auth_token=${TWILIO_AUTH_TOKEN}
twilio.phone_number=${TWILIO_PHONE_NUMBER}